# MA20 Screener — Configuration file
# Edit the values below to match your environment. Do not edit the code itself.

telegram:
  # Telegram bot token (from BotFather). Required for Stage 4 (sending candidates).
  token: "PUT-YOUR-BOT-TOKEN-HERE"
  # Telegram chat ID to receive candidate messages.
  chat_id: "PUT-YOUR-CHAT-ID-HERE"

paths:
  # Directory where the daily CSV file will be written.
  csv_dir: "./output"
  # Directory where log files will be written.
  log_dir: "./logs"

runtime:
  # ---- Phase A (marketCap via yfinance fast_info / quote endpoint) ----
  # The quote endpoint tolerates higher concurrency than the chart endpoint.
  # No retry here: under broad Yahoo rate-limiting, retry only multiplies
  # the runtime without recovering tickers. yfinance exceptions are still
  # surfaced in the per-ticker log line for visibility.
  workers: 10
  fetch_sleep_ms: 100

  # ---- Phase B (OHLCV via yfinance history / chart endpoint) ----
  # Yahoo's chart endpoint is rate-limited much more aggressively than the
  # quote endpoint. Keep these conservative; if you still see "yfinance
  # error" lines, lower history_workers to 1 or raise history_sleep_ms.
  history_workers: 3
  history_sleep_ms: 500
  # The delay doubles between retries (5s, 10s, 20s, ...).
  history_retries: 3
  history_retry_delay_s: 5

  # ---- Universe / validation ----
  # Minimum market capitalization threshold in USD (Phase A).
  min_market_cap_usd: 1000000000
  # Number of trading days of OHLCV history required (Phase B).
  history_trading_days: 60
  # Optional: limit Phase A to this comma-separated list of tickers (testing).
  # Leave empty for a full universe scan.
  test_tickers: ""
