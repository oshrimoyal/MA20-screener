# MA20 Screener — Configuration file
# Edit the values below to match your environment. Do not edit the code itself.

telegram:
  # Telegram bot token (from BotFather). Required for Stage 4 (sending candidates).
  token: "PUT-YOUR-BOT-TOKEN-HERE"
  # Telegram chat ID to receive candidate messages.
  chat_id: "PUT-YOUR-CHAT-ID-HERE"

paths:
  # Directory where the daily CSV file will be written.
  csv_dir: "./output"
  # Directory where log files will be written.
  log_dir: "./logs"

runtime:
  # ---- SEC EDGAR (Phase A exchange labels) ----
  # SEC's fair-access policy requires every request to include a real
  # contact email in the User-Agent header. Replace this with your own
  # email; SEC will return 403 if you keep a generic value.
  sec_user_agent: "MA20-Screener replace-me@example.com"

  # ---- FMP (Phase B OHLCV + marketCap) ----
  # Requires the FMP Starter plan (or higher) — Basic free is too
  # constrained for the S&P 500 universe. Register and subscribe at
  # https://site.financialmodelingprep.com/pricing-plans, then paste
  # the API key from your dashboard below. Starter = 300 calls/min,
  # no daily cap. Each ticker uses two calls (historical + quote), so
  # a full S&P 500 run is ~1,006 calls = ~3-4 minutes.
  fmp_api_key: "PUT-YOUR-FMP-API-KEY-HERE"

  # ---- Phase B concurrency profile ----
  # Defaults yield ~4 calls/sec = ~240 calls/min, safely under the
  # Starter 300/min ceiling. Raise history_workers (or lower
  # history_sleep_ms) if you upgrade to Premium / Ultimate.
  history_workers: 1
  history_sleep_ms: 250
  # Retry policy. Generic transient errors back off 5s, 10s, 20s.
  # HTTP 429 (rate limited) backs off harder (10s, 20s, 40s).
  history_retries: 3
  history_retry_delay_s: 5

  # ---- Universe / validation ----
  # Minimum market capitalization threshold in USD. Read directly from
  # FMP's /quote.marketCap.
  min_market_cap_usd: 1000000000
  # Number of trading days of OHLCV history required.
  history_trading_days: 60
  # Optional: limit Phase A to this comma-separated list of tickers (testing).
  # Leave empty for a full S&P 500 scan.
  test_tickers: ""
